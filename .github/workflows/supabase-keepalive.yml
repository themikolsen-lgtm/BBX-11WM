name: Supabase – garder le projet actif

# Envoie une petite requête de lecture à Supabase tous les 2 jours,
# pour que le projet gratuit ne soit pas mis en pause après 7 jours sans activité.
# Aucune donnée n'est lue ni modifiée (la table est protégée par la sécurité des lignes).

on:
  schedule:
    - cron: "17 6 */2 * *"   # tous les 2 jours à 6 h 17 UTC
  workflow_dispatch:          # lancement manuel possible depuis l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Requête vers Supabase
        env:
          SB_URL: https://izajghznnufkgjsafuxp.supabase.co
          SB_KEY: sb_publishable_COkI6c5lH72Lm2S6unK08g_jfTUWH2A   # clé publique, déjà présente dans l'app
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
            "$SB_URL/rest/v1/kv?select=key&limit=1")
          echo "Réponse Supabase : $code"
          if [ "$code" != "200" ]; then echo "Supabase n'a pas répondu normalement (projet en pause ?)"; exit 1; fi
